# Example consumer workflow. Drop this in .github/workflows/deploy.yml.
# The `approve` job gates the deploy on a signed human approval — the pipeline authenticates as a
# SERVICE identity (it requests) and a human approves (separation of duties). No app code changes.
name: Deploy (human-gated)

on:
  workflow_dispatch:

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Require signed human approval
        uses: intyga-dev/require-approval@v1 # or ./examples/ci-cd-github-action within this repo
        with:
          gateway-url: ${{ secrets.INTYGA_GATEWAY_URL }}
          web-url: ${{ secrets.INTYGA_WEB_URL }}
          client-id: ${{ secrets.INTYGA_CLIENT_ID }}         # a SERVICE (pipeline) identity key
          client-secret: ${{ secrets.INTYGA_CLIENT_SECRET }}
          target: prod-cluster-01 # the environment being deployed to, bound into the signature
          action-type: deploy_production
          action-description: "Deploy ${{ github.repository }}@${{ github.sha }} to production"
          params: '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}'
          approver-keys: ${{ secrets.INTYGA_APPROVER_KEYS }} # keys YOU trust, not the receipt's
          # REQUIRED for passkey receipts: the approval console's origin and RP ID. Without them
          # the offline verifier refuses the receipt rather than trust an assertion from any site.
          webauthn-origin: ${{ vars.INTYGA_WEBAUTHN_ORIGIN }}
          webauthn-rp-id: ${{ vars.INTYGA_WEBAUTHN_RP_ID }}
          timeout: "600"
          # Optional: DM the approver an interactive "Approve" button so they never hunt through CI logs.
          slack-webhook: ${{ secrets.INTYGA_SLACK_WEBHOOK }}
          teams-webhook: ${{ secrets.INTYGA_TEAMS_WEBHOOK }}

  deploy:
    needs: approve # cannot start unless a human approved AND the receipt verified
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved by a human — running the real deploy now."
